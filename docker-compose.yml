services:
  db:
    image: postgres:16
    container_name: jobhunter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
    ports:
      - "5432:5432"
    volumes:
      - jobhunter_pg:/var/lib/postgresql/data

volumes:
  jobhunter_pg:
